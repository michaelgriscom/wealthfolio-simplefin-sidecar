name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lockfile-exact, and no dependency install scripts (esbuild, via tsx,
      # works without its postinstall).
      - run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run type-check

      - name: Docker build
        run: docker build -t wealthfolio-simplefin-sidecar:ci .
